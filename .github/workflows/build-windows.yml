name: Build Windows executable

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "ted_tenders/**"
      - "gui.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compila l'eseguibile (onedir, senza UPX — meno falsi positivi antivirus)
        run: pyinstaller --onedir --noupx --windowed --name TED_Calzature gui.py

      - name: Crea lo zip della cartella compilata
        shell: pwsh
        run: Compress-Archive -Path dist/TED_Calzature/* -DestinationPath TED_Calzature-windows.zip

      - name: Pubblica lo zip come artifact
        uses: actions/upload-artifact@v4
        with:
          name: TED_Calzature-windows
          path: TED_Calzature-windows.zip
          retention-days: 90

      - name: Pubblica lo zip come Release scaricabile senza login
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: windows-build
          name: "TED Calzature (Windows) — ultima build"
          body: >
            Build Windows generata automaticamente dal commit ${{ github.sha }}.
            Scarica TED_Calzature-windows.zip, estrailo in una cartella e
            lancia TED_Calzature.exe dentro di essa (non serve Python
            installato). Eseguibile non firmato digitalmente: se l'antivirus
            lo segnala, vedi le note nel README del repository.
          files: TED_Calzature-windows.zip
          make_latest: true
