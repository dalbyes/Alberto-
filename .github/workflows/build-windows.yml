name: Build Windows executable

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "ted_tenders/**"
      - "gui.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compila l'eseguibile
        run: pyinstaller --onefile --windowed --name TED_Calzature gui.py

      - name: Pubblica l'eseguibile come artifact
        uses: actions/upload-artifact@v4
        with:
          name: TED_Calzature-windows
          path: dist/TED_Calzature.exe
          retention-days: 90

      - name: Pubblica l'eseguibile come Release scaricabile senza login
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: windows-build
          name: "TED Calzature (Windows) — ultima build"
          body: >
            Eseguibile Windows generato automaticamente dal commit
            ${{ github.sha }}. Scarica TED_Calzature.exe qui sotto e lancialo
            con doppio click (non serve Python installato).
          files: dist/TED_Calzature.exe
          make_latest: true
